name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Example: Deploy to Railway (uncomment and set secrets)
      # - uses: railwayapp/railway-deploy@v1
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: competitor-researcher
      # For Vercel/Netlify or custom, add steps here.
      - name: Upload build artifact (for manual deploy)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
